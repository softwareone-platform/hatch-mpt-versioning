[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "hatch-mpt-versioning"
version = "0.1.0"
description = "Hatchling version source plugin for MPT git-describe based versioning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "SoftwareOne Marketplace Platform" }]
dependencies = ["hatchling>=1.21.0"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.entry-points.hatch]
mpt-versioning = "hatch_mpt_versioning.hooks"

[tool.hatch.build.targets.wheel]
packages = ["src/hatch_mpt_versioning"]

