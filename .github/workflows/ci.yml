name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          cache: true

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -p "test_*.py"

      - name: Build distributions
        run: uv build

